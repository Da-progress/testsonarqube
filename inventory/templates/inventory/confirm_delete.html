{% extends "inventory/base.html" %}
{% block title %}Удаление{% endblock %}
{% block page_title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
                <h5 class="mt-3">Вы уверены?</h5>
                <p class="text-muted">Объект <strong>«{{ object }}»</strong> будет удалён без возможности восстановления.</p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>Удалить</button>
                    <a href="{% url back_url %}" class="btn btn-outline-secondary px-4">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
